<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureApp - Welcome</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="container">
        <div class="form-container">
            <!-- Header with logo/icon -->
            <div class="welcome-header">
                <div class="app-logo">
                    <i class="fas fa-shield-alt"></i>
                </div>
                <h1>SecureApp</h1>
                <p>Your data is protected</p>
            </div>

            <!-- Main action button -->
            <button onclick="window.location.href='login.html'" class="welcome-btn">
                <div class="btn-content">
                    <span>Enter Application</span>
                    <i class="fas fa-arrow-right"></i>
                </div>
            </button>

            <!-- Security status -->
            <div class="security-status">
                <div class="status-item">
                    <i class="fas fa-check-circle"></i>
                    <span>IDOR Protection: Active</span>
                </div>
                <div class="status-item">
                    <i class="fas fa-user-shield"></i>
                    <span>Authorization: Enabled</span>
                </div>
            </div>

            <!-- Demo info -->
            <div class="demo-info">
                <h3>Demo Trial Accounts</h3>
                <div class="credentials">
                    <div class="credential-row">
                        <i class="fas fa-user-circle"></i>
                        <div>
                            <p><strong>Chris:</strong> chris123@email.com</p>
                            <p><strong>Password:</strong> 123456</p>
                        </div>
                    </div>
                    
                    <div class="credential-row">
                        <i class="fas fa-user-circle"></i>
                        <div>
                            <p><strong>Hops:</strong> hops123@email.com</p>
                            <p><strong>Password:</strong> 123456</p>
                        </div>
                    </div>
                    
                    <div class="credential-row">
                        <i class="fas fa-user-circle"></i>
                        <div>
                            <p><strong>Diana:</strong> diana123@email.com</p>
                            <p><strong>Password:</strong> 123456</p>
                        </div>
                    </div>
                </div>
                
                <div class="trial-note">
                    <i class="fas fa-info-circle"></i>
                    <span>Try logging in with different accounts and test the security</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
